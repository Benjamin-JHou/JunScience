<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="orbit-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Outer Dodecagon / Orbit points -->
  <circle cx="50" cy="50" r="42" stroke="url(#orbit-grad)" stroke-width="2" stroke-dasharray="4 3" opacity="0.6"/>
  <!-- Orbital Ellipses -->
  <ellipse cx="50" cy="50" rx="42" ry="16" stroke="url(#orbit-grad)" stroke-width="2.5" transform="rotate(-30 50 50)" filter="url(#glow)"/>
  <ellipse cx="50" cy="50" rx="42" ry="16" stroke="url(#orbit-grad)" stroke-width="2.5" transform="rotate(30 50 50)" filter="url(#glow)"/>
  <ellipse cx="50" cy="50" rx="42" ry="16" stroke="url(#orbit-grad)" stroke-width="2" transform="rotate(90 50 50)" opacity="0.7"/>
  
  <!-- Orbital Nodes / Atoms -->
  <circle cx="16" cy="30" r="3.5" fill="#00D2FF" filter="url(#glow)"/>
  <circle cx="84" cy="70" r="3.5" fill="#3B82F6" filter="url(#glow)"/>
  <circle cx="20" cy="72" r="3" fill="#8B5CF6" filter="url(#glow)"/>
  <circle cx="80" cy="28" r="3" fill="#00D2FF" filter="url(#glow)"/>
  <circle cx="50" cy="8" r="3" fill="#38BDF8"/>
  <circle cx="50" cy="92" r="3" fill="#818CF8"/>
  
  <!-- Center stylized J -->
  <path d="M54 30 V56 C54 64 48 68 40 68 C34 68 30 65 28 61 L35 56 C37 59 39 61 42 61 C46 61 47 58 47 54 V30 H54 Z" fill="#FFFFFF" filter="url(#glow)"/>
  <!-- Top bar of J -->
  <rect x="42" y="27" width="18" height="5" rx="1" fill="#FFFFFF" filter="url(#glow)"/>
</svg>
